<main id="app">
  <h1>Qollab smoke harness</h1>
  <p>Throwaway harness (not part of the final upload). One IonQ job per run: press Stop and Run again between IonQ tests.</p>
  <p>Backend: <strong id="backend-name">unknown</strong></p>
  <div role="group" aria-label="Smoke calls" id="buttons"></div>
  <p id="status" role="status" aria-live="polite">Ready</p>
  <table id="log" aria-label="Call log">
    <thead><tr><th scope="col">Call</th><th scope="col">Result</th><th scope="col">Code or error</th><th scope="col">ms</th></tr></thead>
    <tbody></tbody>
  </table>
  <pre id="out" tabindex="0" aria-label="Last result (truncated)"></pre>
</main>
